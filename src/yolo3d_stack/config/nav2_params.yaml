costmap:
 costmap:
   ros__parameters:
     # Frame Settings
     global_frame: odom
     robot_base_frame: base_link
     use_sim_time: False
    
     # Performance
     update_frequency: 5.0
     publish_frequency: 2.0
     rolling_window: true
     width: 10
     height: 10
     resolution: 0.1
    
     # --- Layer Configuration ---
     plugins: ["static_layer", "obstacle_layer", "inflation_layer"]


     # Layer 1: Static Map (Persistent Environment from OctoMap)
     static_layer:
       plugin: "nav2_costmap_2d::StaticLayer"
       map_topic: /projected_map        # OctoMap's 2D projection
       subscribe_to_updates: true       # Update as environment is explored
       use_maximum: true                # Keep both old and new data (persistence)
       lethal_cost_threshold: 100       # Mark occupied cells as lethal
       # Fix QoS mismatch with octomap_server
       map_subscribe_transient_local: true


     # Layer 2: Dynamic Obstacles (Live YOLO Detections)
     obstacle_layer:
       plugin: "nav2_costmap_2d::ObstacleLayer"
       enabled: True
       observation_sources: yolo_source
       combination_method: 1            # 1 = Max (keep highest cost, prevents clearing)


       # YOLO Detected Objects (Flares, Buoys, etc.)
       yolo_source:
         topic: /yolo/obstacle_cloud
         max_obstacle_height: 2.0
         clearing: False                # Don't clear - keep detected objects
         marking: True                  # Mark detected obstacles
         data_type: "PointCloud2"
         obstacle_max_range: 5.0
         min_obstacle_height: -2.0
         obstacle_min_range: 0.0
         raytrace_max_range: 5.0
         raytrace_min_range: 0.0
         expected_update_rate: 0.0      # 0 = No timeout (infinite persistence)
         observation_persistence: 0.0   # 0 = Keep forever


     # Layer 3: Inflation (The Safety Bubble)
     inflation_layer:
       plugin: "nav2_costmap_2d::InflationLayer"
       cost_scaling_factor: 3.0
       inflation_radius: 0.6

